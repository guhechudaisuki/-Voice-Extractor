name: Publish verified WavLM release asset

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: HTTPS download URL of the trained checkpoint
        required: true

permissions:
  contents: write

jobs:
  publish-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the trained checkpoint against the desktop manifest and publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_SOURCE_URL: ${{ inputs.source_url }}
        run: |
          python - <<'PY'
          import ast
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.parse
          import urllib.request

          manifest = ast.parse(Path('launcher/desktop_bootstrap.py').read_text(encoding='utf-8'))
          component = next(node for node in ast.walk(manifest)
                           if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                           and node.func.id == 'ComponentSpec' and node.args
                           and isinstance(node.args[0], ast.Constant)
                           and node.args[0].value == 'wavlm_model')
          asset = next(node for node in ast.walk(component)
                       if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                       and node.func.id == 'DirectFile' and node.args
                       and isinstance(node.args[0], ast.Constant)
                       and node.args[0].value == 'pytorch_model.bin')
          release_url = ast.literal_eval(asset.args[1])
          expected = ast.literal_eval(asset.args[2])
          if not re.fullmatch(r'[a-f0-9]{64}', expected):
              raise ValueError('The desktop manifest must pin a SHA-256 checksum')
          if expected == 'e906bce2fa42fb497a1d1a9ecf81548adb7e03b12a5644e32d2f42f0d6500fad':
              raise ValueError('The manifest selects the original pretrained checkpoint; configure a trained checkpoint before publishing reinforced weights')
          repository = os.environ['GITHUB_REPOSITORY']
          prefix = f'https://github.com/{repository}/releases/download/'
          if not release_url.startswith(prefix):
              raise ValueError('The desktop model URL must belong to this repository')
          tag, filename = release_url[len(prefix):].split('/')
          if tag != 'model-assets':
              raise ValueError('Reinforced weights must be published under the model-assets tag')
          if filename != 'wavlm_reinforced_pytorch_model.bin':
              raise ValueError('Unexpected release asset name')
          source_url = os.environ['MODEL_SOURCE_URL']
          if urllib.parse.urlsplit(source_url).scheme != 'https':
              raise ValueError('The model source must use HTTPS')
          digest = hashlib.sha256()
          with urllib.request.urlopen(source_url, timeout=120) as response, open(filename, 'wb') as output:
              if urllib.parse.urlsplit(response.url).scheme != 'https':
                  raise ValueError('The model download redirected to an insecure URL')
              for block in iter(lambda: response.read(1024 * 1024), b''):
                  digest.update(block)
                  output.write(block)
          if digest.hexdigest() != expected:
              raise ValueError('The checkpoint does not match the desktop manifest')
          subprocess.run(['gh', 'release', 'upload', tag, filename, '--repo', repository], check=True)
          print(f'Published {filename}: SHA256 {expected}')
          PY
